<!-- ===== MOBILE HEADER ===== -->

<header
  class="mobile-header"
  *ngIf="auth.isLoggedIn()"
>

  <button (click)="toggleSidebar()">
    ☰
  </button>

  <span>
    Knowledge Hub
  </span>

</header>

<!-- ===== BACKDROP ===== -->

<div
  class="backdrop"
  *ngIf="sidebarOpen && !isDesktop && auth.isLoggedIn()"
  (click)="toggleSidebar()"
>
</div>

<!-- ===== MAIN LAYOUT ===== -->

<div
  class="layout"
  *ngIf="auth.isLoggedIn(); else loginView"
  (touchstart)="onTouchStart($event)"
  (touchmove)="onTouchMove($event)"
  (touchend)="onTouchEnd()"
>

  <!-- ===== SIDEBAR ===== -->

  <aside
    class="sidebar"
    [class.open]="sidebarOpen"
  >

    <!-- ===== LOGO ===== -->

    <h3
      class="logo"
      routerLink="/"
      (click)="sidebarOpen=false"
    >

      Learning Docs

    </h3>

    <!-- ===== HOME ===== -->

    <a
      class="home-link"
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="sidebarOpen=false"
    >

      🏠 Home

    </a>

    <!-- ===== LOGOUT ===== -->

    <button
      class="logout-btn"
      (click)="logout()"
    >

      Logout

    </button>

    <!-- ===== MENU GROUPS ===== -->

    <div
      *ngFor="let group of docs"
      class="menu-group"
    >

      <!-- Group Title -->

      <h4
        class="group-title"
        (click)="toggle(group)"
      >

        <span [class.rotated]="group.open">
          ▶
        </span>

        {{ group.title }}

      </h4>

      <!-- Pages -->

      <div *ngIf="group.open">

        <a
          *ngFor="let page of group.pages"
          [routerLink]="[
            '/docs',
            group.section,
            page.slug
          ]"
          routerLinkActive="active"
          (click)="sidebarOpen=false"
        >

          {{ page.title }}

        </a>

      </div>

    </div>

  </aside>

  <!-- ===== CONTENT ===== -->

  <main class="content">

    <!-- Desktop Menu Button -->

    <button
      class="collapse-btn"
      (click)="toggleSidebar()"
    >

      ☰

    </button>

    <router-outlet>
    </router-outlet>

  </main>

</div>

<!-- ===== LOGIN VIEW ===== -->

<ng-template #loginView>

  <router-outlet>
  </router-outlet>

</ng-template>
