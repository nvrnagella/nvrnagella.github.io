<div class="login-container">

  <div class="login-card">

    <h2>Knowledge Hub Login</h2>

    <input
      type="text"
      placeholder="Username"
      [(ngModel)]="username"
    />

    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="password"
    />

    <button (click)="login()">
      Login
    </button>

    <p *ngIf="error" class="error">
      {{ error }}
    </p>

  </div>

</div>
